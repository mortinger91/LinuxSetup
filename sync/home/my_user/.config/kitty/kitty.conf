# Ported from iTerm2 profile "Default" (dark variant).
# iTerm2 had "Use Separate Colors for Light and Dark Mode" = yes; macOS is in Dark
# mode, so the (Dark) color set is what was actually on screen.
#
# Linux adaptations:
#   - Session save/restore removed (it relied on a macOS LaunchAgent)
#   - Cmd shortcuts remapped to Ctrl. Where that would collide with kitty's
#     built-in tab keys, Alt is added so both bindings stay distinct.
#   - Menlo is not available; Fira Code is used for italic faces too (kitty
#     synthesizes italics since Fira Code ships no italic variant).
#   - macos_colorspace dropped (macOS-only, no-op on Linux).

# ── Font ──────────────────────────────────────────────────────────────────────
# Face selection lives in the BEGIN_KITTY_FONTS block at the end of this file,
# managed by `kitten choose-fonts` — edit it there, not here.
font_size        10.5

# Glyph compositing, as "gamma contrast%". macOS `platform` default is "1.7 30",
# which renders light-on-dark text thicker and brighter than iTerm2; `legacy`
# undershoots it. This sits between the two. Raise the second number toward 30
# for more weight/brightness, lower it toward 0 for less.
text_composition_strategy 1.7 0

# iTerm2 had "ASCII Ligatures" = yes. kitty renders ligatures by default, so
# nothing to set. To turn them off: disable_ligatures always

# ── Window ────────────────────────────────────────────────────────────────────
# Blank area between text and window border, in pts. Two values = vertical,
# horizontal. Four values would be top, right, bottom, left (CSS order).
window_padding_width 0 3

copy_on_select clipboard

# ── Colors ────────────────────────────────────────────────────────────────────
background       #000000
foreground       #00ff00
cursor           #ffffff
# iTerm2 stored cursor-text as #ffffff, i.e. white text under a white cursor
# (invisible). Using the cell background instead so the cursor is readable.
cursor_text_color background

# beam, not block: shell integration forces a beam at the prompt, so anything
# else here produces a visible shape change the moment a command starts.
cursor_shape          beam
# Seconds; lower = faster. -1 would follow the system rate (~0.5), 0 disables.
cursor_blink_interval 0.5
# kitty otherwise stops blinking after 15s idle; 0 blinks indefinitely, matching
# VS Code's terminal.
cursor_stop_blinking_after 0

selection_foreground #000000
selection_background #b3d7ff

url_color #328eee

# ANSI palette (identical in the light and dark sets)
color0  #090d12
color1  #a71600
color2  #00b700
color3  #dbd800
color4  #1138e6
color5  #b506b2
color6  #00d9db
color7  #bdbdbd
color8  #545454
color9  #d84a45
color10 #17e468
color11 #fff300
color12 #a4a9ff
color13 #dd50dd
color14 #18fcff
color15 #ffffff
# ── Scrollback ────────────────────────────────────────────────────────────────
# Effectively unlimited. kitty holds scrollback in RAM and its docs warn that
# very large values cost memory and can slow the terminal; memory is allocated
# on demand, so the ceiling only matters if you actually generate that output.
scrollback_lines 1000000000
scrollback_pager_history_size 64

# ── Scrolling ─────────────────────────────────────────────────────────────────
# Applies to kitty's own scrollback only, not to full-screen TUIs.
pixel_scroll     yes

# Trackpad scroll amount in kitty's OWN scrollback only. In full-screen TUIs
# (opencode, vim) kitty ignores this and wheel_scroll_multiplier except for
# direction (kitty/mouse.c scale_scroll), so they cannot change TUI scroll speed.
# TUIs get one event per full line of accumulated delta, and KDE's per-device
# ScrollFactor (~/.config/kcminputrc: G502 0.5, MX Ergo 0.3, touchpad 0.1)
# shrinks that delta first: G502 needs 2 notches per event. Raise this value
# if the trackpad feels slow in plain kitty scrollback. 8.0 offsets most of
# the touchpad's 0.1 KDE factor (10.0 would cancel it fully).
touch_scroll_multiplier 8.0

# Lines per mouse-wheel notch (default 5). KDE's G502 ScrollFactor 0.5 halves
# each notch before kitty sees it, so 2.0 gives exactly 1 line per flick in
# kitty's own scrollback (0.5 x 2). Also applies when a full-screen app without
# mouse tracking gets the wheel as arrow keys; ignored (direction only) when the
# app grabs the mouse, as opencode does by default.
wheel_scroll_multiplier 2.0

# Inertial (momentum) scrolling for touchpads, default 0.96. kitty synthesizes
# the coasting events itself on Wayland, and they reach TUIs too, so a swipe
# keeps scrolling opencode after the fingers lift. 0 disables it. Needs a full
# kitty restart (not just a config reload).
momentum_scroll 0

# Arrow-key repeat scrolling in a TUI outpaces vsync, so key repeats get
# coalesced into frames and read as choppy. kitty's docs recommend disabling
# sync for high keyboard repeat rates.
sync_to_monitor no

# Default 10ms caps ~100 FPS; with sync off, lowering it actually raises the
# frame rate, at the cost of some CPU.
repaint_delay 2

# Delay before kitty processes output from the program. It sits in the path of
# every keypress, so zeroing it cuts single-tap latency. Documented risk: full
# screen programs that repaint entirely each loop can show partial frames /
# flicker -- if opencode tears, raise this back to 1 or the default 3.
input_delay 1

# The `smooth` argument animates the scroll, which reads as input delay on a
# keypress. Dropping it makes these jump instantly, like iTerm2.
# alt+arrows scroll one line; ctrl+up/down jump between shell command prompts
# (needs kitty shell integration, on by default).
map ctrl+up          scroll_to_prompt -1
map ctrl+down        scroll_to_prompt 1
map alt+up          scroll_line_up
map alt+down        scroll_line_down
map ctrl+shift+up   scroll_line_up
map ctrl+shift+down scroll_line_down

# Tab management. These are additions -- kitty keeps its defaults unless a key
# is explicitly remapped, so both work.
# WARNING: kitty now swallows ctrl+t and ctrl+w, so programs running inside it
# never receive them.
map ctrl+t new_tab
map ctrl+shift+t new_window
map ctrl+w close_tab

# Tab reordering. A literal Cmd→Ctrl translation would produce ctrl+tab /
# ctrl+shift+right, which are kitty's own next_tab/previous_tab bindings, so
# these use Alt to stay distinct. kitty's defaults (ctrl+shift+. / ctrl+shift+,)
# still work too.
map ctrl+alt+tab         move_tab_forward
map ctrl+alt+shift+tab   move_tab_backward
map ctrl+alt+shift+right move_tab_forward
map ctrl+alt+shift+left  move_tab_backward

# ── Tab bar ───────────────────────────────────────────────────────────────────
# Vertical list on the left so many opencode sessions stay readable. Sidebar
# width follows tab_title_max_length (in cells; kitty uses ~20 when unset).
tab_bar_edge         left
tab_title_max_length 30
# Always shown, so the content column does not jump when a second tab opens.
tab_bar_min_tabs     1
# Drawn by ~/.config/kitty/tab_bar.py: title word-wrapped over 2 rows, scrolls
# to keep the active tab visible. tab_title_template is unused with it.
tab_bar_style        custom
# Selected tab: palette green (color2) instead of kitty's default light grey.
active_tab_background #00b700
active_tab_foreground #000000
# Other tabs: kitty's default grey background, text darkened from #444.
inactive_tab_foreground #222222
# Plain text everywhere; kitty's default for the selected tab is bold-italic.
active_tab_font_style   normal
inactive_tab_font_style normal
# Gap above the first tab: kitty paints it with the first cell's colour (the grey
# tab edge) unless set; keep it the window background.
tab_bar_margin_color #000000

# ── Links ─────────────────────────────────────────────────────────────────────
# Ctrl+click opens links; a plain click only selects or moves the prompt cursor.
# "grabbed" covers TUIs that capture the mouse (opencode), so it works there too.
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link


# BEGIN_KITTY_FONTS
font_family      family='Fira Code' variable_name=FiraCodeRoman wght=350
bold_font        family='Fira Code' postscript_name=FiraCode-SemiBold
italic_font      family='Fira Code'
bold_italic_font family='Fira Code'
# END_KITTY_FONTS
